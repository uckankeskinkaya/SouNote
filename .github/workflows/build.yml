name: APK derle

on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/probe.yml"
      - "docs/**"
      - ".github/publish/**"
      - ".github/video/**"
      - ".github/workflows/video.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Önbellek bu dalda da yazılsın (varsayılan: sadece ana dalda yazar; burada hiç kullanılmıyordu).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel
          cp app/build/outputs/apk/release/app-release.apk SouNote.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SouNote-apk
          path: SouNote.apk

  # Her push bir TEST sürümü (ön sürüm) üretir: sadece yönetici (test kanalını açan) alır.
  # Herkese gitmesi için "Sürümü yayınla" iş akışı çalıştırılır (publish.yml).
  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.tip.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SouNote-apk
          path: .

      # GitHub, derleme sürerken dal ilerlediyse eski commit'e etiket koydurmuyor (workflows izni ister).
      # O durumda bu derleme yayınlanmaz; daha yeni commit'in derlemesi yayınlar.
      - name: Dalın en yeni commit'i mi?
        id: tip
        run: |
          tip=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Daha yeni commit var ($tip); bu derleme yayınlanmıyor."; fi

      - name: Sürüm notu
        if: steps.tip.outputs.latest == 'true'
        run: git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md || echo "Yeni derleme" > notes.md

      - name: Test sürümü oluştur
        if: steps.tip.outputs.latest == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Test 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body_path: notes.md
          files: SouNote.apk

      # Sabit "test" kanalı: en yeni test APK'sı + test.json (GitHub sürüm listesi ön sürümleri güvenilir göstermiyor;
      # uygulamanın yönetici modu, video ve "Sürümü yayınla" en yeni test sürümünü buradan okur).
      - name: Test kanalını güncelle
        if: steps.tip.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          N="${{ github.run_number }}"
          python3 -c "import json,sys; print(json.dumps({'build': int(sys.argv[1]), 'name': 'Test 1.0.' + sys.argv[1], 'notes': open('notes.md').read().strip(), 'sha': sys.argv[2]}, ensure_ascii=False))" "$N" "$GITHUB_SHA" > test.json
          if ! gh release view test -R "$R" >/dev/null 2>&1; then
            gh release create test -R "$R" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Test kanalı" --notes "Yönetici için en yeni test derlemesi (otomatik güncellenir)."
          fi
          gh release upload test SouNote.apk test.json -R "$R" --clobber

      # Haftalık ders kataloğu ayrı kanalda ("catalog" etiketi): yayın beklemeden herkese gider.
      - name: Kataloğu güncelle
        if: steps.tip.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          if ! gh release view catalog -R "$R" >/dev/null 2>&1; then
            gh release create catalog -R "$R" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Ders kataloğu" --notes "Uygulamanın haftalık ders kaynakları listesi (otomatik güncellenir)."
          fi
          gh release upload catalog app/src/main/assets/catalog.json -R "$R" --clobber

  # Test sürümüyle aynı anda emülatörde çökme testi. Uygulama çökerse test sürümüne uyarı yazılır;
  # "Sürümü yayınla" böyle bir sürümü herkese göndermez.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SouNote-apk
          path: a

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Açılmış emülatörün kaydı (snapshot) önbellekte: her seferinde sıfırdan açılmaz.
      - name: Emülatör önbelleği
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-pixel6-v1

      - name: Emülatör kaydı oluştur
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Emülatör kaydı hazır"

      - name: Emülatörde çökme testi
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ./.github/smoke.sh

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots

      # Görüntüler "screenshots" dalına da konur (README ve indirme sayfası için; artifact'ler oturum açmadan indirilemiyor).
      - name: Görüntüleri dala gönder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "build ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" screenshots

  # Test başarısızsa test sürümüne uyarı yaz (yayınlanması engellenir).
  rollback:
    needs: [release, smoke]
    if: failure() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Uyarı yaz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "build-${{ github.run_number }}" -R "${{ github.repository }}" \
            --notes "⚠️ Bu derleme çökme testinden geçemedi; yayınlanmamalı."
