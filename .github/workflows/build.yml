name: APK derle

on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/probe.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SouNote.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SouNote-apk
          path: SouNote.apk

  # Her derleme emülatörde açılıp ekranları gezer; çökerse release yapılmaz (arkadaşlara bozuk sürüm gitmez).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SouNote-apk
          path: a

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde çökme testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ./.github/smoke.sh

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots

      # Görüntüler "screenshots" dalına da konur (README ve indirme sayfası için; artifact'ler oturum açmadan indirilemiyor).
      - name: Görüntüleri dala gönder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "build ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" screenshots

  release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # Aynı anda iki derleme release oluşturmaya çalışıp çakışmasın.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SouNote-apk
          path: .

      - name: Sürüm notu
        run: git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md || echo "Yeni derleme" > notes.md

      # Tabletten zip açmadan indirmek için: Releases sayfasında doğrudan APK.
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SouNote 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          # En yeni derleme "Latest" olur: releases/latest/download/SouNote.apk hep en yeni APK'yı indirir.
          prerelease: false
          make_latest: true
          # Uygulamadaki "Yeni sürüm" penceresi bu metni gösterir.
          body_path: notes.md
          # catalog.json: uygulama açılışta haftalık kaynakları buradan günceller (releases/latest/download/catalog.json).
          files: |
            SouNote.apk
            app/src/main/assets/catalog.json
