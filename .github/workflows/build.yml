name: APK derle

on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/probe.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Önbellek bu dalda da yazılsın (varsayılan: sadece ana dalda yazar; burada hiç kullanılmıyordu).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # İmza anahtarı depoda değil, GitHub Secrets'ta (Settings → Secrets and variables → Actions).
      - name: İmza anahtarını hazırla
        env:
          KS: ${{ secrets.SOUNOTE_KEYSTORE_B64 }}
          KP: ${{ secrets.SOUNOTE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::SOUNOTE_KEYSTORE_B64 ve SOUNOTE_KEY_PASSWORD secret'ları eksik (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/sounote.jks"
          echo "SOUNOTE_KEYSTORE=$RUNNER_TEMP/sounote.jks" >> "$GITHUB_ENV"
          echo "SOUNOTE_KEY_PASSWORD=$KP" >> "$GITHUB_ENV"

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel
          cp app/build/outputs/apk/release/app-release.apk SouNote.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SouNote-apk
          path: SouNote.apk

      # SouNote 2.0 geliştirme dalı: test için ayrıca debug APK (aynı anahtarla imzalı, mevcut uygulamanın üstüne kurulur).
      - name: Debug APK (2.0 dalı)
        if: github.ref_name == 'ccr-c4eded18-21kvrf'
        run: |
          ./gradlew assembleDebug --build-cache --parallel
          cp app/build/outputs/apk/debug/app-debug.apk SouNote-2.0-debug.apk

      - name: Debug APK'yı yükle (2.0 dalı)
        if: github.ref_name == 'ccr-c4eded18-21kvrf'
        uses: actions/upload-artifact@v4
        with:
          name: SouNote-2.0-debug-apk
          path: SouNote-2.0-debug.apk

  # APK test beklemeden yayınlanır (derlemeden ~1 dk sonra hazır).
  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.tip.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SouNote-apk
          path: .

      # GitHub, derleme sürerken dal ilerlediyse eski commit'e etiket koydurmuyor (workflows izni ister).
      # O durumda bu derleme yayınlanmaz; daha yeni commit'in derlemesi yayınlar.
      - name: Dalın en yeni commit'i mi?
        id: tip
        run: |
          tip=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Daha yeni commit var ($tip); bu derleme yayınlanmıyor."; fi

      - name: Sürüm notu
        if: steps.tip.outputs.latest == 'true'
        run: git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md || echo "Yeni derleme" > notes.md

      - name: Release oluştur
        if: steps.tip.outputs.latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SouNote 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          # En yeni derleme "Latest" olur: releases/latest/download/SouNote.apk hep en yeni APK'yı indirir.
          prerelease: false
          make_latest: true
          # Uygulamadaki "Yeni sürüm" penceresi bu metni gösterir.
          body_path: notes.md
          # catalog.json: uygulama açılışta haftalık kaynakları buradan günceller (releases/latest/download/catalog.json).
          files: |
            SouNote.apk
            app/src/main/assets/catalog.json

  # Yayınla aynı anda emülatörde çökme testi. Uygulama çökerse sürüm "ön sürüm" yapılır:
  # releases/latest (indirme bağlantısı ve uygulamadaki güncelleme bildirimi) bir önceki sağlam sürüme döner.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SouNote-apk
          path: a

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Açılmış emülatörün kaydı (snapshot) önbellekte: her seferinde sıfırdan açılmaz.
      - name: Emülatör önbelleği
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-pixel6-v1

      - name: Emülatör kaydı oluştur
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Emülatör kaydı hazır"

      - name: Emülatörde çökme testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ./.github/smoke.sh

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots

      # Görüntüler "screenshots" dalına da konur (README ve indirme sayfası için; artifact'ler oturum açmadan indirilemiyor).
      - name: Görüntüleri dala gönder
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 2.0 dalının görüntüleri ayrı dala gider; README'nin kullandığı "screenshots" dalı değişmez.
          branch=screenshots
          [ "${GITHUB_REF_NAME}" = "ccr-c4eded18-21kvrf" ] && branch=screenshots-v2
          cd shots
          git init -q -b "$branch"
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "build ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$branch"

  # Test başarısızsa yayınlanan sürümü geri çek (ön sürüm yap).
  rollback:
    needs: [release, smoke]
    if: failure() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Sürümü ön sürüme çek
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "build-${{ github.run_number }}" -R "${{ github.repository }}" --prerelease --latest=false \
            --notes "⚠️ Bu derleme çökme testinden geçemedi; indirme bağlantısı önceki sürüme döndü."
          prev=$(gh release list -R "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          [ -n "$prev" ] && gh release edit "$prev" -R "${{ github.repository }}" --latest
