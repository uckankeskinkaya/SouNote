name: APK derle

on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SouNote.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SouNote-apk
          path: SouNote.apk

      # Tabletten zip açmadan indirmek için: Releases sayfasında doğrudan APK.
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SouNote 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          # En yeni derleme "Latest" olur: releases/latest/download/SouNote.apk hep en yeni APK'yı indirir.
          prerelease: false
          make_latest: true
          body: "Dal: ${{ github.ref_name }} · commit ${{ github.sha }}"
          files: SouNote.apk
