name: APK derle

on:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki derleme release oluşturmaya çalışıp çakışmasın.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SouNote.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: SouNote-apk
          path: SouNote.apk

      - name: Sürüm notu
        run: git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md || echo "Yeni derleme" > notes.md

      # Tabletten zip açmadan indirmek için: Releases sayfasında doğrudan APK.
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SouNote 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          # En yeni derleme "Latest" olur: releases/latest/download/SouNote.apk hep en yeni APK'yı indirir.
          prerelease: false
          make_latest: true
          # Uygulamadaki "Yeni sürüm" penceresi bu metni gösterir.
          body_path: notes.md
          # catalog.json: uygulama açılışta haftalık kaynakları buradan günceller (releases/latest/download/catalog.json).
          files: |
            SouNote.apk
            app/src/main/assets/catalog.json
