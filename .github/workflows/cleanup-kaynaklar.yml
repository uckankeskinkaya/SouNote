name: GitHub'daki ders PDF kopyalarını sil (tek seferlik)

# Okul materyallerinin PDF kopyaları herkese açık GitHub'da durmasın: "kaynaklar" sürümünü ve etiketini siler.
# PDF kopyalar artık sahibinin Drive'ında üretiliyor (tools/drive_pdf.gs).
on:
  push:
    paths:
      - ".github/workflows/cleanup-kaynaklar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Sil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view kaynaklar -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete kaynaklar -R "${{ github.repository }}" --yes --cleanup-tag
            echo "Silindi"
          else
            echo "Zaten yok"
          fi
