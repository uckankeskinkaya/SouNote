name: Kaynakları PDF'e çevir

# Katalogdaki Word/PowerPoint dosyalarını LibreOffice ile PDF'e çevirir ve "kaynaklar" sürümüne yükler;
# uygulama bunları "İndir" ile kütüphaneye alır. Katalog değişince kendiliğinden çalışır.
on:
  push:
    paths:
      - "app/src/main/assets/catalog.json"
      - ".github/convert/**"
      - ".github/workflows/convert.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: LibreOffice ve yazı tipleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress libreoffice-writer \
            fonts-liberation fonts-dejavu fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-core >/dev/null

      - name: Çevir ve yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/convert/convert.py
