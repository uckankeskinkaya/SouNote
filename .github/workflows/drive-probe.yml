name: Drive klasör denemesi

# Geçici: Drive'ın herkese açık klasör listesini (embeddedfolderview) anahtarsız okuyabiliyor muyuz.
on:
  push:
    branches-ignore: [main, screenshots, canva-assets, probe-out]
    paths: [".github/probe/drive.txt"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src, sparse-checkout: .github/probe }
      - name: Listele
        run: |
          mkdir out
          while read -r ID; do [ -z "$ID" ] && continue
            curl -sS -L -A "Mozilla/5.0 (Linux; Android 16)" -o "out/$ID.html" -w "%{http_code} %{size_download}\n" "https://drive.google.com/embeddedfolderview?id=$ID"
          done < src/.github/probe/drive.txt
      - name: probe-out dalına koy
        run: |
          git init -q r && cd r
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git checkout -q --orphan probe-out
          cp ../out/* .
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Drive denemesi" && git push -qf origin HEAD:probe-out
