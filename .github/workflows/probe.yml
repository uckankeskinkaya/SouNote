name: Release izni testi (geçici)
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -x
          # Temizlik
          for id in $(gh api "repos/$R/releases?per_page=20" -q '.[] | select(.draft) | .id'); do gh api -X DELETE repos/$R/releases/$id || true; done
          for t in probe-main probe-head probe-rel-main probe-rel-head probe-git-old; do gh api -X DELETE repos/$R/git/refs/tags/$t || true; done
          # Eski commit'e git ile etiket
          git tag probe-git-old 3e0ebe43656bb942f5cc73eb32752bfe7ec6a740
          git push origin probe-git-old && echo GIT_TAG_OK
          gh api -X POST repos/$R/releases -f tag_name=probe-git-old -F draft=true -q .id && echo REL_ON_EXISTING_TAG_OK
          for id in $(gh api "repos/$R/releases?per_page=20" -q '.[] | select(.draft) | .id'); do gh api -X DELETE repos/$R/releases/$id || true; done
          gh api -X DELETE repos/$R/git/refs/tags/probe-git-old || true
