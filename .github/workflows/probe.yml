name: Kurulum denemesi

# Geçici: yayınlanan APK'yı Android 10 ve 13 emülatörlerinde imza denetimi + kurulumla dener (LineageOS 20 kurulum hatası).
on:
  push:
    branches-ignore: [main, screenshots]
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33]
    steps:
      - name: APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "${{ github.repository }}" -p SouNote.apk -D latest
          gh release download test -R "${{ github.repository }}" -p SouNote.apk -D test
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in latest test; do
            echo "== $f"; sha256sum $f/SouNote.apk
            "$BT/apksigner" verify -v --min-sdk-version ${{ matrix.api }} $f/SouNote.apk 2>&1 | head -12 || true
            "$BT/zipalign" -c -P 16 -v 4 $f/SouNote.apk | tail -2 || true
            "$BT/aapt2" dump badging $f/SouNote.apk 2>/dev/null | grep -E "^package|sdkVersion|native-code" || true
          done
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kur
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install latest/SouNote.apk 2>&1 | tail -3 || true
            adb shell pm list packages com.sounote.app || true
            adb uninstall com.sounote.app || true
            adb install test/SouNote.apk 2>&1 | tail -3 || true
            adb shell am start -W -n com.sounote.app/.SouNoteActivity 2>&1 | tail -3 || true
            sleep 5; adb shell pidof com.sounote.app && echo "ÇALIŞIYOR" || echo "ÇALIŞMIYOR"
            adb logcat -d | grep -iE "PackageManager.*(fail|error)|INSTALL_FAILED|FATAL" | tail -10 || true
