name: Evren model listesi

# Geçici: Evren'in herkese açık model listesi (anahtarsız) ve belgeleri.
on:
  push:
    branches-ignore: [main, screenshots]
    paths: [".github/workflows/probe.yml"]

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://evren-llmapi.ssyz.org.tr/v1/models https://evren-llmapi.ssyz.org.tr/models https://evren-llmapi.ssyz.org.tr/v1/terms/text https://evren-llmapi.ssyz.org.tr/docs https://evren-llmapi.ssyz.org.tr/openapi.json; do
            echo "== $u"; curl -sS -m 20 "$u" | head -c 4000; echo
          done
