name: Sürümü yayınla

# Test edilmiş bir test sürümünü herkese açar: arkadaşların uygulaması güncelleme bildirimi alır,
# indirme bağlantısı (releases/latest) ve sitedeki "Yenilikler" bu sürüme geçer.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm adı (ör. 1.1)"
        required: true
      title:
        description: "Kısa başlık (ör. Writing pratiği ve yeni ana sayfa)"
        required: true
      notes:
        description: "Yenilikler; maddeleri | ile ayır (ör. Writing pratiği | Bugünkü tekrar | Telefon düzeni)"
        required: true
      build:
        description: "Test sürümü numarası (boş = en yeni test sürümü)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Yayınla
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          BUILD: ${{ inputs.build }}
        run: |
          if [ -n "$BUILD" ]; then tag="build-$BUILD"; else
            tag=$(gh api "repos/$R/releases?per_page=30" -q '[.[] | select(.prerelease and (.tag_name | startswith("build-")))][0].tag_name')
          fi
          [ -n "$tag" ] || { echo "::error::Test sürümü bulunamadı"; exit 1; }
          body=$(gh release view "$tag" -R "$R" --json body -q .body)
          if echo "$body" | grep -q "⚠️"; then echo "::error::$tag çökme testinden geçmemiş; yayınlanmaz"; exit 1; fi
          # Notlar: | ile ayrılmış maddeler → satır satır
          printf '%s\n' "$TITLE" > notes.md
          echo "$NOTES" | tr '|' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | sed 's/^/- /' >> notes.md
          cat notes.md
          gh release edit "$tag" -R "$R" --prerelease=false --latest --title "SouNote $VERSION" --notes-file notes.md
          # Eski uygulamalar kataloğu releases/latest'ten çekiyor: güncel kataloğu bu sürüme de ekle.
          gh release download catalog -R "$R" -p catalog.json -D cat && gh release upload "$tag" cat/catalog.json -R "$R" --clobber || true
          echo "::notice::$tag → SouNote $VERSION herkese yayınlandı"
